# llm.dari.asia - Management Center web panel
server {
    listen 80;
    listen [::]:80;
    server_name llm.dari.asia;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($block_sensitive_probe) {
            return 444;
        }
        if ($block_direct_access) {
            return 444;
        }
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name llm.dari.asia;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS - force HTTPS for 1 year + includeSubDomains + preload eligible
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Prevent browsers from MIME-sniffing responses away from declared type
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Prevent Flash/Acrobat from sending cross-domain requests
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($block_sensitive_probe) {
        return 444;
    }

    if ($block_direct_access) {
        return 444;
    }

    # Allow dashboard model discovery only
    # Expose GET/OPTIONS /v1/models, block every other /v1 path
    location = /v1/models {
        limit_req zone=mgmt burst=30 nodelay;

        # Allow dashboard to read models list from JS
        add_header Access-Control-Allow-Origin "https://llm.dari.asia" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age 3600 always;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Only allow model discovery methods
        limit_except GET OPTIONS {
            deny all;
        }

        proxy_pass http://172.18.0.1:8317;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block all other /v1 endpoints on dashboard domain
    location = /v1 {
        return 403;
    }

    location ^~ /v1/ {
        return 403;
    }

    # CPA-Manager handles management APIs and proxies CPA where needed.
    location ^~ /v0/management/ {
        limit_req zone=mgmt burst=20 nodelay;

        proxy_pass http://172.18.0.1:8318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CLI Proxy API - non-management v0 endpoints, if needed by the dashboard.
    location /v0 {
        limit_req zone=mgmt burst=20 nodelay;

        proxy_pass http://172.18.0.1:8317;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Management Center web panel
    location / {
        proxy_pass http://172.18.0.1:8318;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CSP - single-file SPA with inlined assets
        # - script-src 'unsafe-inline': required by vite-plugin-singlefile (all JS inlined)
        # - style-src 'unsafe-inline': required by CSS modules & dynamic styles
        # - img-src data: blob:: inline logo + chart exports
        # - connect-src 'self' https: wss: API + WebSocket connections
        # - font-src 'self': bundled fonts if any
        # - frame-ancestors 'none': prevent clickjacking via iframe
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}