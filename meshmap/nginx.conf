# Rate limit zone for /v0 management endpoint
limit_req_zone $binary_remote_addr zone=mgmt:10m rate=5r/s;

# Reduce server fingerprinting
server_tokens off;

# Proper Connection header handling for WebSocket and non-WebSocket requests
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Drop common scanner/probe requests before they reach upstream apps
map $request_uri $block_sensitive_probe {
    default 0;
    ~*(^|/)\.git(/|$) 1;
    ~*(^|/)\.env($|[.?/]) 1;
    ~*(^|/)\.svn(/|$) 1;
    ~*(^|/)\.hg(/|$) 1;
    ~*(^|/)wp-admin(/|$) 1;
    ~*(^|/)wp-login\.php($|[?]) 1;
    ~*(^|/)phpinfo\.php($|[?]) 1;
    ~*\.(sql|bak|backup|old|orig|swp|tar|tgz|zip|gz|7z|rar)($|[?]) 1;
}

# Cloudflare origin protection.
# Only requests from Cloudflare IP ranges with CF-Connecting-IP are allowed.
geo $from_cloudflare {
    default 0;

    # Cloudflare IPv4 ranges
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    # Cloudflare IPv6 ranges
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map $http_cf_connecting_ip $has_cf_connecting_ip {
    default 1;
    "" 0;
}

map "$from_cloudflare:$has_cf_connecting_ip" $block_direct_access {
    default 1;
    "1:1" 0;
}

# Default server - reject unknown domains
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_reject_handshake on;

    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name map.dari.asia;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($block_sensitive_probe) {
            return 444;
        }
        if ($block_direct_access) {
            return 444;
        }
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name map.meshnode.id;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($block_sensitive_probe) {
            return 444;
        }
        # map.meshnode.id is not behind Cloudflare, so do not apply
        # $block_direct_access here. Redirect direct HTTP to HTTPS.
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name map.dari.asia;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.opentopomap.org https://unpkg.com; connect-src 'self' wss: ws: https://unpkg.com https://cloudflareinsights.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; object-src 'none'; frame-ancestors 'self'" always;

    if ($block_sensitive_probe) {
        return 444;
    }

    if ($block_direct_access) {
        return 444;
    }

    # No cache for all static frontend files
    add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /tracker.html {
        try_files $uri =404;
    }

    location ~* ^/(css/tracker\.css|js/tracker\.js)$ {
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/img/favicon.ico;
    }

    # nodes.json is written by meshobserv into /data and updated every minute
    location = /nodes.json {
        alias /data/nodes.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # API proxy to meshobserv - allow caching
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name map.meshnode.id;

    # Let's Encrypt cert mounted from the host.
    ssl_certificate     /letsencrypt/live/kemplu.dari.asia/fullchain.pem;
    ssl_certificate_key /letsencrypt/live/kemplu.dari.asia/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.opentopomap.org https://unpkg.com; connect-src 'self' wss: ws: https://unpkg.com https://cloudflareinsights.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; object-src 'none'; frame-ancestors 'self'" always;

    if ($block_sensitive_probe) {
        return 444;
    }

    # Do not block direct access: this hostname is intentionally not proxied by Cloudflare.

    # No cache for all static frontend files
    add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /tracker.html {
