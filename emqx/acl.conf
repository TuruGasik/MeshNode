%% EMQX ACL Configuration - MeshNode Indonesia (Phase 1)
%% NOTE: Valid Erlang-term ACL format only.

%% Allow monitoring subscriptions
{allow, {username, "kemplu"}, subscribe, ["$SYS/#"]}.
{allow, {username, "meshmap"}, subscribe, ["$SYS/#"]}.

%% Core topic access
{allow, {username, "kemplu"}, all, ["#"]}.
{allow, {username, "idmeshnode"}, all, ["msh/#"]}.
{allow, {username, "meshmap"}, subscribe, ["msh/ID/#"]}.
{allow, {username, "mqtt-relay"}, subscribe, ["msh/ID/#"]}.
{allow, {username, "mqtt-relay"}, publish, ["msh/ID/#"]}.
{allow, {username, "BMKGGempa"}, subscribe, ["msh/ID/2/#"]}.
{allow, {username, "BMKGGempa"}, publish, ["msh/ID/2/#"]}.

%% Deny everything else
{deny, all}.
